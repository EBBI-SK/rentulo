<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="login.documentTitle">Přihlášení - Rentulo</title>
  <link rel="icon" type="image/png" href="assets/rentulo-logo-mark.png" />
  <link id="rentuloSharedTheme" rel="stylesheet" href="css/rentulo-theme.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/password-visibility.css" />
</head>

<body data-navigation-page="prihlaseni">
  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="assets/rentulo-logo-mark.png" alt="" aria-hidden="true" />
      </div>
      <div class="logo-text">
        <strong>Rentulo</strong>
      </div>
    </a>
    <nav class="nav" id="mainNav"></nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-intro">
        <p class="eyebrow" data-i18n="login.eyebrow">Vítejte zpět</p>
        <h1 data-i18n="login.title">Přihlášení</h1>
        <p data-i18n="login.description">
          Přihlaste se ke svému účtu. Pokud jste sem přišli z jiné stránky, vrátíme vás zpět. Jinak se otevře úvodní stránka.
        </p>

        <div class="auth-helper-box">
          <strong data-i18n="login.helperTitle">Účet Rentulo</strong>
          <span data-i18n="login.helperText">Použijte e-mail a heslo zadané při registraci.</span>
        </div>
      </div>

      <form class="auth-form" id="loginForm" autocomplete="on" novalidate>
        <div
          class="auth-error-message"
          id="loginError"
          role="alert"
          aria-live="assertive"
        ></div>

        <div class="form-group">
          <label for="loginEmail" data-i18n="login.emailLabel">E-mail</label>
          <input
            id="loginEmail"
            type="email"
            name="email"
            autocomplete="username"
            inputmode="email"
            autocapitalize="none"
            spellcheck="false"
            maxlength="254"
            aria-describedby="loginError"
            data-i18n-placeholder="login.emailPlaceholder"
            placeholder="např. jan@email.cz"
            required
          />
        </div>

        <div class="form-group">
          <label for="loginPassword" data-i18n="login.passwordLabel">Heslo</label>
          <input
            id="loginPassword"
            type="password"
            name="password"
            autocomplete="current-password"
            maxlength="1024"
            aria-describedby="loginError"
            data-i18n-placeholder="login.passwordPlaceholder"
            placeholder="Zadejte heslo"
            required
          />
        </div>

        <p class="auth-note auth-note-right">
          <a href="obnova-hesla.html" data-i18n="login.forgotPassword">Zapomněli jste heslo?</a>
        </p>

        <label class="terms-check">
          <input id="rememberLogin" name="rememberLogin" type="checkbox" />
          <span data-i18n="login.remember">Zapamatovat přihlášení na tomto zařízení.</span>
        </label>

        <button type="submit" class="auth-button" id="loginSubmitButton" data-i18n="login.submit">
          Přihlásit se
        </button>

        <p class="auth-note">
          <span data-i18n="login.noAccount">Ještě nemáte účet?</span>
          <a href="registrace.html" data-i18n="login.createAccount">Vytvořit účet</a>
        </p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/password-visibility.js"></script>
  <script src="js/login-page.js"></script>
</body>
</html>
