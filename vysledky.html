<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Výsledky vyhledávání - Rentulo</title>

  <link rel="icon" type="image/png" href="assets/rentulo-logo-mark.png" />
  <link id="rentuloSharedTheme" rel="stylesheet" href="css/rentulo-theme.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Structural header host. Shared navigation.js and rentulo-theme.css control the navigation UI. */
    .header {
      width: min(1320px, calc(100% - 32px));
      margin: 0 auto;
      padding: 14px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
    }

    .logo-icon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-text strong {
      display: block;
      color: var(--rentulo-ink, #102019);
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--rentulo-ink, #102019);
      font-family: var(--rentulo-font, system-ui, -apple-system, "Segoe UI", Arial, sans-serif);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .results-page {
      width: min(1320px, calc(100% - 64px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    .results-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 24px;
      color: var(--rentulo-green, #176747);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      text-decoration: none;
    }

    .results-back-link:hover {
      color: var(--rentulo-green-dark, #0e5037);
    }

    .results-header {
      margin-bottom: 22px;
    }

    .results-header h1 {
      margin: 0;
      color: var(--rentulo-ink, #102019);
      font-size: clamp(38px, 4vw, 58px);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 0.98;
    }

    .nearby-results-banner {
      display: none;
      margin: 0 0 18px;
      padding: 14px 16px;
      border: 1px solid #cfe4da;
      border-radius: 16px;
      background: #edf7f2;
      color: var(--rentulo-ink, #102019);
    }

    .nearby-results-banner.active {
      display: block;
    }

    .nearby-results-banner strong {
      display: block;
      margin-bottom: 3px;
      font-size: 14px;
      font-weight: 800;
    }

    .nearby-results-banner span {
      display: block;
      color: var(--rentulo-muted, #64706b);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }

    .nearby-results-banner.warning {
      border-color: #f0b2bb;
      background: #fff0f1;
      color: #9d2634;
    }

    .nearby-results-banner.warning span {
      color: #9d2634;
    }

    .results-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .filters-card {
      position: sticky;
      top: 18px;
      padding: 20px;
      border: 1px solid var(--rentulo-line, #e5e9e5);
      border-radius: 22px;
      background: var(--rentulo-surface, #ffffff);
      box-shadow: 0 12px 30px rgba(16, 32, 25, 0.05);
    }

    .filters-card h2 {
      margin: 0 0 16px;
      color: var(--rentulo-ink, #102019);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .filter-group {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    .filter-group:last-child {
      margin-bottom: 0;
    }

    .filter-group label {
      color: var(--rentulo-ink, #102019);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      height: 46px;
      border: 1px solid #d9e1dd;
      border-radius: 13px;
      background: #fbfcfb;
      color: var(--rentulo-ink, #102019);
      font-size: 13px;
      font-weight: 700;
    }

    .filter-group input {
      padding: 0 13px;
      outline: 0;
    }

    .filter-group input::placeholder {
      color: #8b9791;
      opacity: 1;
      font-weight: 500;
    }

    .filter-group select {
      padding: 0 38px 0 13px;
      cursor: pointer;
    }

    .results-date-status {
      margin: 0 0 12px;
      color: var(--rentulo-muted, #64706b);
      font-size: 12px;
      line-height: 1.5;
    }

    .results-date-status.error {
      color: #ad3030;
    }

    .results-date-status[hidden] {
      display: none;
    }

    #results-search-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      margin-top: 2px;
      padding: 0 18px;
      border: 0;
      border-radius: 14px;
      background: var(--rentulo-action-green, #00835a);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 9px 20px rgba(0, 112, 75, 0.14);
      transition: background 0.16s ease, transform 0.16s ease;
    }

    #results-search-button::after {
      content: "→";
      margin-left: 8px;
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
    }

    #results-search-button:hover {
      background: var(--rentulo-action-green-hover, #006846);
      transform: translateY(-1px);
    }

    /* BOD 5: one compact CO / KDY / KDE bar on desktop; stack it on mobile. */
    .results-searchbar {
      position: relative; z-index: 3;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, .78fr) minmax(0, 1fr) 66px;
      align-items: stretch; min-height: 76px; gap: 0;
      margin: 0 0 18px; padding: 7px;
      border: 1px solid var(--rentulo-line, #e5e9e5); border-radius: 20px;
      background: #fff; box-shadow: 0 12px 30px rgba(16, 32, 25, .055);
    }
    .results-search-field {
      position: relative; display: grid; align-content: center;
      gap: 4px; min-width: 0; padding: 7px 18px;
    }
    .results-search-field + .results-search-field::before {
      content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
      width: 1px; background: #e7e9e6;
    }
    .results-search-field > label, .results-search-field-heading {
      color: #16251f; font-size: 12px; font-weight: 800;
      letter-spacing: .04em; text-transform: uppercase;
    }
    .results-search-field > input {
      width: 100%; min-width: 0; height: 30px; padding: 0;
      border: 0; outline: 0; background: transparent;
      color: #102019; font-size: 14px; font-weight: 600;
    }
    .results-search-field > input::placeholder { color: #8b9490; opacity: 1; font-weight: 500; }
    /* BOD 5: compact date-range selector, a single visible KDY? field. */
    .search-date-picker { position: relative; min-width: 0; }
    .search-date-picker > summary {
      display: flex; align-items: center; justify-content: space-between; gap: 7px;
      min-width: 0; min-height: 30px; list-style: none; cursor: pointer;
      color: #8b9490; font-size: 14px; font-weight: 500;
    }
    .search-date-picker > summary::-webkit-details-marker { display: none; }
    .search-date-picker > summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-date-picker.has-dates > summary { color: var(--rentulo-ink, var(--ink, #102019)); font-weight: 600; }
    .search-date-picker > summary svg {
      flex: 0 0 18px; width: 18px; height: 18px; fill: none;
      stroke: #247654; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .search-date-picker > summary:focus-visible,
    .search-date-popover input:focus-visible,
    .search-date-clear:focus-visible { outline: 2px solid #00835a; outline-offset: 2px; }
    .search-date-popover {
      position: absolute; z-index: 40; left: -12px; top: calc(100% + 12px);
      width: 300px; max-width: calc(100vw - 36px);
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
      padding: 14px; border: 1px solid #d9e5df; border-radius: 15px;
      background: #fff; box-shadow: 0 18px 38px rgba(16, 32, 25, 0.16);
    }
    .search-date-control { display: grid; gap: 6px; min-width: 0; }
    .search-date-control label { color: #102019; font-size: 12px; font-weight: 700; letter-spacing: 0; text-transform: none; }
    .search-date-control input[type="date"] {
      width: 100%; min-width: 0; height: 42px; padding: 0 5px;
      border: 1px solid #d9e1dd; border-radius: 10px; background: #fbfcfb;
      color: #102019; font-size: 12px; font-weight: 500; color-scheme: light;
    }
    .search-date-error { grid-column: 1 / -1; margin: 0; font-size: 12px; color: #ad3030; }
    .search-date-error[hidden] { display: none; }
    .search-date-clear {
      grid-column: 1 / -1; justify-self: end; padding: 6px 1px;
      border: 0; background: transparent; color: #176747;
      font-size: 12px; font-weight: 700; cursor: pointer;
    }
    @media (max-width: 760px) {
      .search-date-popover {
        position: static; width: 100%; max-width: none;
        margin-top: 8px; padding: 8px 0 4px; border: 0;
        border-top: 1px solid #e7e9e6; border-radius: 0; box-shadow: none;
      }
    }

    .results-searchbar #results-search-button {
      align-self: center; justify-self: end;
      width: 62px; height: 48px; min-height: 48px;
      padding: 0; margin: 0; border-radius: 14px;
    }
    .results-searchbar #results-search-button::after { margin-left: 0; font-size: 27px; }
    .results-search-button-label {
      position: absolute; width: 1px; height: 1px; margin: -1px;
      padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
    }
    @media (max-width: 760px) {
      .results-searchbar { grid-template-columns: 1fr; padding: 7px; margin-bottom: 14px; border-radius: 18px; }
      .results-search-field { padding: 10px 12px; }
      .results-search-field + .results-search-field::before {
        left: 12px; right: 12px; top: 0; bottom: auto; width: auto; height: 1px;
      }
      .results-searchbar #results-search-button {
        position: relative; justify-self: stretch;
        width: 100%; height: 52px; margin-top: 4px;
      }
      .results-searchbar #results-search-button::after {
        position: absolute; right: 16px; font-size: 25px;
      }
      .results-search-button-label {
        position: static; width: auto; height: auto; margin: 0;
        clip: auto; overflow: visible; white-space: normal; font-size: 16px;
      }
    }

    .results-list {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .result-card {
      display: grid;
      grid-template-columns: 154px minmax(0, 1fr);
      gap: 18px;
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--rentulo-line, #e5e9e5);
      border-radius: 24px;
      background: var(--rentulo-surface, #ffffff);
      box-shadow: 0 14px 34px rgba(16, 32, 25, 0.055);
    }

    .result-image {
      position: relative;
      width: 154px;
      height: 154px;
      overflow: hidden;
      border: 1px solid #e0e7e3;
      border-radius: 18px;
      background: #eef5f1;
    }

    .result-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-image-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--rentulo-green, #176747);
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      transform: translate(-50%, -50%);
    }

    .result-image-icon::before {
      content: "⌁";
    }

    .result-image > span {
      position: absolute;
      right: 10px;
      bottom: 10px;
      left: 10px;
      overflow: hidden;
      color: #53615b;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-main {
      display: flex;
      min-width: 0;
      flex-direction: column;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin: 2px 0 14px;
    }

    .result-title {
      margin: 0 0 5px;
      color: var(--rentulo-ink, #102019);
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .result-meta {
      margin: 0;
      color: var(--rentulo-muted, #64706b);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }

    .result-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 9px;
      margin-bottom: 15px;
    }

    .result-info-box {
      min-width: 0;
      min-height: 62px;
      padding: 10px 12px;
      border: 1px solid #dce9e3;
      border-radius: 14px;
      background: #f3f8f5;
    }

    .result-info-box span {
      display: block;
      margin-bottom: 3px;
      color: var(--rentulo-muted, #64706b);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }

    .result-info-box strong {
      display: block;
      color: var(--rentulo-ink, #102019);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .result-info-box.distance strong {
      color: var(--rentulo-green, #176747);
    }

    .result-info-box.distance.missing strong {
      color: #78847e;
    }

    .result-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: auto;
    }

    .result-button,
    .empty-results-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 19px;
      border: 0;
      border-radius: 14px;
      background: var(--rentulo-action-green, #00835a);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 9px 20px rgba(0, 112, 75, 0.14);
      transition: background 0.16s ease, transform 0.16s ease;
    }

    .result-button:hover,
    .empty-results-button:hover {
      background: var(--rentulo-action-green-hover, #006846);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .empty-results {
      padding: 28px;
      border: 1px solid var(--rentulo-line, #e5e9e5);
      border-radius: 24px;
      background: var(--rentulo-surface, #ffffff);
      box-shadow: 0 14px 34px rgba(16, 32, 25, 0.055);
    }

    .empty-results h2 {
      margin: 0 0 8px;
      color: var(--rentulo-ink, #102019);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    .empty-results p {
      max-width: 760px;
      margin: 0;
      color: var(--rentulo-muted, #64706b);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.55;
    }

    .empty-results-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .empty-results-button.light {
      border: 1px solid #d9e5df;
      background: #edf5f1;
      color: #32443c;
      box-shadow: none;
    }

    .empty-results-button.light:hover {
      background: #e3efe9;
      color: var(--rentulo-ink, #102019);
      transform: none;
    }

    .filter-group input:focus-visible,
    .filter-group select:focus-visible,
    #results-search-button:focus-visible,
    .result-button:focus-visible,
    .empty-results-button:focus-visible,
    .results-back-link:focus-visible {
      outline: 3px solid rgba(23, 103, 71, 0.24);
      outline-offset: 3px;
    }

    html[data-focus-input="pointer"] .filter-group input:focus,
    html[data-focus-input="pointer"] .filter-group select:focus,
    html[data-focus-input="pointer"] #results-search-button:focus,
    html[data-focus-input="pointer"] .result-button:focus,
    html[data-focus-input="pointer"] .empty-results-button:focus,
    html[data-focus-input="pointer"] .results-back-link:focus {
      outline: none;
      box-shadow: none;
    }

    @media (min-width: 761px) {
      .result-info {
        grid-template-columns: none;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        gap: 0;
        margin-bottom: 12px;
        border-top: 1px solid var(--rentulo-line, #e5e9e5);
        border-bottom: 1px solid var(--rentulo-line, #e5e9e5);
      }

      .result-info-box {
        min-height: 0;
        padding: 10px 14px;
        border: 0;
        border-right: 1px solid var(--rentulo-line, #e5e9e5);
        border-radius: 0;
        background: transparent;
      }

      .result-info-box:first-child {
        padding-left: 0;
      }

      .result-info-box:last-child {
        padding-right: 0;
        border-right: 0;
      }
    }

    @media (min-width: 1101px) {
      .result-card {
        grid-template-columns: 140px minmax(0, 1fr);
        gap: 16px;
        padding: 14px;
        border-radius: 22px;
      }

      .result-image {
        width: 140px;
        height: 140px;
        border-radius: 16px;
      }

      .result-heading {
        margin: 1px 0 10px;
      }
    }

    @media (max-width: 1100px) {
      .results-page {
        width: min(1040px, calc(100% - 48px));
        padding-top: 26px;
      }

      .results-header h1 {
        font-size: clamp(42px, 7vw, 62px);
      }

      .results-layout {
        grid-template-columns: 1fr;
      }

      .filters-card {
        position: static;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        align-items: end;
      }

      .filters-card h2 { grid-column: 1 / -1; }

      .filters-card h2 {
        margin: 0 0 4px;
      }

      .filter-group {
        margin: 0;
      }
    }

    @media (max-width: 760px) {
      .results-page {
        width: calc(100% - 32px);
        padding: 22px 0 42px;
      }

      .results-back-link {
        margin-bottom: 18px;
        font-size: 14px;
      }

      .results-header {
        margin-bottom: 16px;
      }

      .results-header h1 {
        font-size: clamp(38px, 12vw, 52px);
      }

      .nearby-results-banner {
        margin-bottom: 14px;
      }

      .filters-card {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 17px;
        border-radius: 20px;
      }

      .filters-card h2 { grid-column: auto; }

      .filters-card h2 {
        margin: 0;
      }


      .result-card {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 14px;
        border-radius: 22px;
      }

      .result-image {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        border-radius: 17px;
      }

      .result-heading {
        margin: 0 0 12px;
      }

      .result-title {
        font-size: 21px;
      }

      .result-info {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .result-actions {
        justify-content: stretch;
      }

      .result-button {
        width: 100%;
      }

      .empty-results {
        padding: 21px;
        border-radius: 22px;
      }

      .empty-results-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .empty-results-button {
        width: 100%;
      }
    }

    @media (max-width: 430px) {
      .results-page {
        width: calc(100% - 28px);
      }

      .results-header h1 {
        font-size: clamp(36px, 12vw, 46px);
      }

      .result-info {
        grid-template-columns: 1fr;
      }
    }

    /* SK mobile price select */
    @media (max-width: 760px) {
      html[lang="sk"] #priceFilter {
        font-size: 11px;
        padding-left: 10px;
        padding-right: 28px;
      }
    }
</style>
</head>

<body data-navigation-page="vysledky" data-i18n-document-title="results.documentTitle">

  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="assets/rentulo-logo-mark.png" alt="" aria-hidden="true" />
      </div>

      <div class="logo-text">
        <strong>Rentulo</strong>
      </div>
    </a>

    <nav class="nav" id="mainNav"></nav>
  </header>

  <main class="results-page">
    <a href="index.html" class="results-back-link" data-rentulo-back="true" data-i18n="results.back">← Zpět</a>

    <section class="results-header">
      <h1 id="resultsTitle" data-i18n="results.title">Věci k půjčení</h1>
    </section>

    <div class="nearby-results-banner" id="nearbyResultsBanner">
      <strong data-i18n="results.nearbyTitle">Hledání podle vaší polohy</strong>
      <span id="nearbyResultsText" data-i18n="results.nearbyDefault">
        Nabídky s uloženou polohou řadíme podle vzdálenosti od vás. Nabídky bez GPS polohy zobrazujeme pod nimi.
      </span>
    </div>

    <div class="results-searchbar" role="search">
      <div class="results-search-field">
        <label for="results-search-what" data-i18n="results.searchWhatLabel">Co hledáte?</label>
        <input id="results-search-what" type="text" placeholder="např. vrtačka nebo stan" data-i18n-placeholder="results.searchWhatPlaceholder" />
      </div>
      <div class="results-search-field results-search-when">
        <span class="results-search-field-heading" id="results-when-heading" data-i18n="search.whenLabel">Kdy?</span>
        <details class="search-date-picker" id="results-search-when">
              <summary aria-labelledby="results-when-heading results-when-value">
                <span id="results-when-value">Vyberte termín</span>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4 M17 3v4 M3 10h18"/></svg>
              </summary>
              <div class="search-date-popover">
                <div class="search-date-control">
                  <label for="results-date-from" data-i18n="search.dateFrom">Od</label>
                  <input id="results-date-from" type="date" autocomplete="off" />
                </div>
                <div class="search-date-control">
                  <label for="results-date-to" data-i18n="search.dateTo">Do</label>
                  <input id="results-date-to" type="date" autocomplete="off" />
                </div>
                <p class="search-date-error" id="results-date-error" role="status" aria-live="polite" hidden></p>
                <button type="button" class="search-date-clear" id="results-date-clear" data-i18n="search.dateClear">Vymazat termín</button>
              </div>
            </details>
      </div>
      <div class="results-search-field">
        <label for="results-search-where" data-i18n="results.searchWhereLabel">Kde?</label>
        <input id="results-search-where" type="text" placeholder="město nebo PSČ" data-i18n-placeholder="results.searchWherePlaceholder" />
      </div>
      <button id="results-search-button" type="button"><span class="results-search-button-label" data-i18n="results.searchButton">Vyhledat</span></button>
    </div>
    <p id="results-date-status" class="results-date-status" role="status" aria-live="polite" hidden></p>

    <section class="results-layout">
      <aside class="filters-card">
        <h2 data-i18n="results.filtersTitle">Filtry</h2>

        <div class="filter-group">
          <label for="categoryFilter" data-i18n="results.categoryLabel">Kategorie</label>
          <select id="categoryFilter">
            <option value="" data-i18n="results.categoryAll">Všechny kategorie</option>
            <option value="Domácnost" data-i18n="home.category.household">Domácnost</option>
            <option value="Zahrada" data-i18n="home.category.garden">Zahrada</option>
            <option value="Stavba" data-i18n="home.category.construction">Stavba</option>
            <option value="Hobby" data-i18n="home.category.hobby">Hobby</option>
            <option value="Párty" data-i18n="home.category.party">Párty</option>
            <option value="Ostatní" data-i18n="home.category.other">Ostatní</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="priceFilter" data-i18n="results.priceLabel">Cena za den</label>
          <select id="priceFilter">
            <option value="" data-i18n="results.priceAny">Bez omezení</option>
            <option value="100" data-i18n="results.price100">Do 100 Kč</option>
            <option value="250" data-i18n="results.price250">Do 250 Kč</option>
            <option value="500" data-i18n="results.price500">Do 500 Kč</option>
          </select>
        </div>


      </aside>

      <section class="results-list" id="resultsList" aria-live="polite"></section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/offer-utils.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/nearby-location.js"></script>
  <script src="js/results-page.js"></script>
</body>
</html>
