<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="home.documentTitle">Rentulo - půjčovna věcí</title>
  <link rel="icon" type="image/png" href="assets/rentulo-logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.css" />

  <style>
    :root {
      --page: #F5F8F6;
      --surface: #ffffff;
      --ink: #102019;
      --muted: #64706b;
      --green: #176747;
      --green-dark: #0e5037;
      --green-soft: #e9f4ee;
      --mint: #dff7ee;
      --orange: #ff6a00;
      --orange-hover: #e85f00;
      --line: #e5e9e5;
      --shadow: 0 22px 60px rgba(16, 32, 25, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--page);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Manrope", Arial, sans-serif;
      background: var(--page);
      color: var(--ink);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .header {
      position: relative;
      z-index: 1000;
      width: min(1480px, calc(100% - 64px));
      margin: 0 auto;
      padding: 14px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    .logo-icon {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      display: grid;
      place-items: center;
    }

    .logo-icon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-text strong {
      display: block;
      color: #101c18;
      font-size: 27px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px 22px;
      min-width: 0;
      color: #17251f;
      font-size: 14px;
      font-weight: 700;
    }

    .nav > a:not(.btn-register):not(.logout-link) {
      padding: 10px 1px;
      border-bottom: 2px solid transparent;
      transition: color 0.16s ease, border-color 0.16s ease;
    }

    .nav > a:not(.btn-register):not(.logout-link):hover,
    .nav > a.active-link:not(.btn-register):not(.logout-link) {
      color: var(--green);
      border-bottom-color: rgba(23, 103, 71, 0.22);
    }

    .nav-notification-badge {
      background: var(--orange) !important;
      color: #ffffff !important;
    }

    .nav-account-link:hover .nav-notification-badge {
      background: var(--orange-hover) !important;
    }

    .btn-register,
    .logout-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 14px;
      background: var(--orange);
      color: #ffffff !important;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(255, 106, 0, 0.16);
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .btn-register:hover,
    .logout-link:hover {
      background: var(--orange-hover);
      transform: translateY(-1px);
    }

    main {
      width: min(1480px, calc(100% - 64px));
      margin: 0 auto;
      padding: 6px 0 14px;
    }

    .home-hero {
      display: grid;
      grid-template-columns: minmax(0, 0.96fr) minmax(560px, 1.04fr);
      gap: 34px;
      align-items: center;
      min-height: calc(100vh - 92px);
    }

    .home-copy {
      position: relative;
      z-index: 5;
      min-width: 0;
      padding: 12px 4px 18px;
      transform: translateY(-36px);
    }

    .home-copy h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(54px, 4.6vw, 80px);
      line-height: 0.96;
      letter-spacing: -0.06em;
      font-weight: 800;
      text-wrap: balance;
      color: var(--ink);
      background: linear-gradient(
        to bottom,
        #101c18 0%,
        #101c18 46%,
        var(--green) 46%,
        var(--green) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .home-text {
      max-width: 640px;
      margin: 36px 0 36px;
      color: #58645f;
      font-size: 17px;
      line-height: 1.58;
      font-weight: 500;
    }

    .search-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 0.72fr) 66px;
      align-items: stretch;
      gap: 0;
      width: min(100%, 760px);
      min-height: 82px;
      margin: 18px 0 20px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 18px 42px rgba(16, 32, 25, 0.075);
    }

    .search-field {
      position: relative;
      display: grid;
      align-content: center;
      gap: 4px;
      min-width: 0;
      padding: 7px 18px;
    }

    .search-field + .search-field::before {
      content: "";
      position: absolute;
      left: 0;
      top: 16px;
      bottom: 16px;
      width: 1px;
      background: #e7e9e6;
    }

    .search-field label {
      color: #16251f;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    .search-field input {
      width: 100%;
      min-width: 0;
      height: 30px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
    }

    .search-field input::placeholder {
      color: #8b9490;
      opacity: 1;
      font-weight: 500;
    }

    .search-button {
      align-self: center;
      justify-self: end;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--orange);
      color: white;
      cursor: pointer;
      box-shadow: 0 11px 24px rgba(255, 106, 0, 0.22);
      transition: background 0.16s ease, transform 0.16s ease;
    }

    .search-button:hover {
      background: var(--orange-hover);
      transform: translateX(2px);
    }

    .search-button svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .search-button-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .home-points {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      width: min(100%, 760px);
      margin-top: 20px;
    }

    .home-point-button {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 7px;
      min-width: 0;
      min-height: 88px;
      padding: 10px 7px 9px;
      border: 1px solid #e4e8e4;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      text-align: center;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(16, 32, 25, 0.045);
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .home-point-button:hover {
      transform: translateY(-3px);
      border-color: #c9dcd1;
      box-shadow: 0 14px 30px rgba(16, 32, 25, 0.08);
    }

    .home-category-icon {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border: 1px solid #d8e5dc;
      border-radius: 13px;
      background: var(--green-soft);
      color: var(--green);
    }

    .home-category-icon svg {
      width: 23px;
      height: 23px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .home-point-button span {
      min-width: 0;
      font-size: 13px;
      line-height: 1.22;
      font-weight: 800;
    }

    .home-map-card {
      min-width: 0;
      display: grid;
      gap: 4px;
      isolation: isolate;
    }

    .home-map-stage {
      position: relative;
      min-width: 0;
      height: clamp(455px, 64vh, 610px);
      overflow: visible;
    }

    .home-map-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(221, 228, 223, 0.95);
      border-radius: 38% 62% 36px 70% / 25% 22% 28px 75%;
      background: #eef2ef;
      box-shadow: var(--shadow);
    }

    .home-offers-map {
      width: 100%;
      height: 100%;
      min-height: 0;
      z-index: 1;
      background: #eef2ef;
    }

    .home-map-ui {
      position: absolute;
      inset: 0;
      z-index: 620;
      pointer-events: none;
    }

    .home-map-zoom-controls {
      position: absolute;
      top: 21%;
      right: 4px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;
      border: 1px solid rgba(218, 226, 220, 0.92);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 6px 16px rgba(16, 32, 25, 0.10);
      backdrop-filter: blur(10px);
      pointer-events: auto;
    }

    .home-map-zoom-button {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      box-shadow: none;
    }

    .home-map-zoom-button + .home-map-zoom-button {
      border-top: 1px solid #e5e9e5;
    }

    .home-map-zoom-button:hover {
      background: #f7faf8;
    }

    .home-map-zoom-button:focus-visible {
      outline: 3px solid rgba(255, 106, 0, 0.22);
      outline-offset: 2px;
    }

    .home-map-zoom-button:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .home-map-notice {
      position: absolute;
      left: 50%;
      bottom: 10px;
      z-index: 620;
      display: grid;
      justify-items: center;
      align-content: start;
      gap: 3px;
      width: max-content;
      min-height: 39px;
      max-width: min(78%, 360px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .home-map-status,
    .home-map-empty-status {
      width: max-content;
      max-width: 100%;
      padding: 5px 10px;
      border: 1px solid rgba(225, 232, 227, 0.96);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.96);
      color: #57645f;
      text-align: center;
      font-size: 9px;
      line-height: 1.3;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(16, 32, 25, 0.09);
      backdrop-filter: blur(8px);
      white-space: normal;
      pointer-events: none;
    }

    .home-map-status[hidden],
    .home-map-empty-status[hidden] {
      display: none;
    }

    .home-map-attribution {
      position: absolute;
      right: 14px;
      bottom: 12px;
      z-index: 620;
      padding: 1px 5px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.84);
      color: #6f7a75;
      font-size: 8px;
      line-height: 1.25;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: auto;
    }

    .home-map-attribution:hover {
      color: var(--green);
      text-decoration: underline;
    }

    .home-map-popup {
      min-width: 190px;
      color: var(--ink);
      font-family: "Manrope", Arial, sans-serif;
    }

    .home-map-popup strong,
    .home-map-popup span {
      display: block;
    }

    .home-map-popup-name {
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 800;
    }

    .home-map-popup-meta,
    .home-map-popup-rating,
    .home-map-popup-more {
      margin-top: 3px;
      color: #66726d;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 600;
    }

    .home-map-popup-link {
      display: inline-flex;
      margin-top: 9px;
      padding: 7px 10px;
      border-radius: 9px;
      background: var(--orange);
      color: #ffffff !important;
      font-size: 12px;
      font-weight: 800;
    }

    .home-map-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border: 3px solid white;
      border-radius: 50% 50% 50% 10%;
      background: var(--orange);
      color: white;
      box-shadow: 0 5px 14px rgba(16, 32, 25, 0.25);
      font-size: 12px;
      font-weight: 800;
      transform: rotate(-45deg);
    }

    .home-map-marker span {
      transform: rotate(45deg);
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: white;
    }

    .leaflet-container {
      font-family: "Manrope", Arial, sans-serif;
    }

    .home-offers-map.leaflet-container::after {
      top: 50%;
      left: 50%;
      right: auto;
      bottom: auto;
      width: max-content;
      max-width: min(82%, 360px);
      min-height: 0;
      transform: translate(-50%, -50%);
      padding: 10px 14px;
      border: 1px solid rgba(213, 227, 219, 0.96);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--ink);
      font-family: "Manrope", Arial, sans-serif;
      font-size: 11px;
      line-height: 1.35;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 10px 26px rgba(16, 32, 25, 0.14);
      backdrop-filter: blur(8px);
      white-space: normal;
    }

    @media (min-width: 1101px) {
      .search-box {
        margin-top: 38px;
        margin-bottom: 0;
      }

      .home-points {
        margin-top: 38px;
      }
    }

    @media (max-width: 1220px) {
      .header,
      main {
        width: min(100% - 36px, 1180px);
      }

      .nav {
        flex-wrap: wrap;
      }

      .home-hero {
        grid-template-columns: minmax(0, 0.92fr) minmax(470px, 1.08fr);
        gap: 24px;
      }

      .home-copy h1 {
        font-size: clamp(52px, 5.5vw, 72px);
      }

      .home-points {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .home-point-button {
        grid-template-columns: 38px minmax(0, 1fr);
        justify-items: stretch;
        text-align: left;
        align-content: center;
        min-height: 58px;
        padding: 9px 10px;
      }
    }

    @media (max-width: 1100px) {
      .header {
        padding-top: 15px;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .nav {
        width: 100%;
        justify-content: flex-start;
        gap: 7px 14px;
      }

      .home-hero {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .home-copy {
        padding-top: 24px;
        transform: none;
      }

      .home-copy h1 {
        max-width: 780px;
        font-size: clamp(48px, 9vw, 72px);
        background: none;
        color: var(--ink);
        -webkit-text-fill-color: currentColor;
      }

      .home-text,
      .search-box,
      .home-points {
        width: 100%;
        max-width: none;
      }

      .home-map-card {
        margin-top: 6px;
      }

      .home-map-stage {
        height: 470px;
      }
    }

    @media (max-width: 640px) {
      .header,
      main {
        width: min(100% - 28px, 640px);
      }

      .header {
        padding: 12px 0 8px;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .logo-icon {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
      }

      .logo-text strong {
        font-size: 24px;
      }

      .nav {
        font-size: 13px;
      }

      .btn-register,
      .logout-link {
        min-height: 40px;
        padding: 0 15px;
        border-radius: 11px;
      }

      main {
        padding-bottom: 24px;
      }

      .home-copy {
        padding-top: 18px;
      }

      .home-copy h1 {
        font-size: clamp(40px, 12vw, 54px);
        line-height: 1;
      }

      .home-text {
        margin: 18px 0 20px;
        font-size: 15px;
      }

      .search-box {
        grid-template-columns: 1fr;
        gap: 0;
        min-height: 0;
        padding: 7px;
        border-radius: 18px;
      }

      .search-field {
        padding: 10px 12px;
      }

      .search-field + .search-field::before {
        left: 12px;
        right: 12px;
        top: 0;
        bottom: auto;
        width: auto;
        height: 1px;
      }

      .search-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        width: 100%;
        height: 48px;
        margin-top: 4px;
        border-radius: 13px;
      }

      .search-button-label {
        position: static;
        width: auto;
        height: auto;
        margin-right: 0;
        clip: auto;
        overflow: visible;
        white-space: normal;
      }

      .home-points {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .home-point-button {
        grid-template-columns: 34px minmax(0, 1fr);
        min-height: 58px;
        padding: 8px 9px;
        text-align: left;
      }

      .home-category-icon {
        width: 34px;
        height: 34px;
      }

      .home-category-icon svg {
        width: 21px;
        height: 21px;
      }

      .home-map-stage {
        height: 410px;
      }

      .home-map-shell {
        border-radius: 30px 30px 30px 62px;
      }

      .home-map-zoom-controls {
        top: 12px;
        right: 12px;
        border-radius: 8px;
      }

      .home-map-zoom-button {
        width: 28px;
        height: 28px;
        font-size: 15px;
      }

      .home-map-attribution {
        right: 12px;
        bottom: 10px;
      }

    }

    @media (min-width: 641px) {
      .home-map-notice {
        top: 78%;
        bottom: auto;
        max-width: min(52%, 340px);
        transform: translate(-50%, -50%);
      }
    }

    @media (min-width: 641px) and (max-width: 1100px) {
      .header {
        padding: 12px 0 8px;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
    }

    @media (min-width: 1101px) and (max-height: 780px) {
      .header {
        padding-top: 8px;
        padding-bottom: 6px;
      }

      main {
        padding-top: 2px;
      }

      .home-hero {
        min-height: calc(100vh - 76px);
      }

      .home-copy h1 {
        font-size: clamp(50px, 4.6vw, 72px);
      }

      .home-text {
        margin-top: 16px;
        margin-bottom: 18px;
        font-size: 15px;
      }

      .search-box {
        min-height: 72px;
        margin-bottom: 12px;
      }

      .home-point-button {
        min-height: 78px;
      }

      .home-map-stage {
        height: clamp(420px, 62vh, 520px);
      }
    }
    /* Desktop home: reserve room for the shared footer without overlaying content. */
    @media (min-width: 1101px) {
      body {
        display: flex;
        flex-direction: column;
      }

      main {
        display: flex;
        flex: 1 0 auto;
      }

      .home-hero {
        flex: 1 1 auto;
        min-height: 0;
      }

      .home-copy {
        transform: translateY(clamp(-36px, calc(700px - 100vh), 0px));
      }
    }

  </style>
</head>

<body data-navigation-page="uvod">
  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="assets/rentulo-logo-mark.png" alt="" width="46" height="46" aria-hidden="true" />
      </div>
      <div class="logo-text">
        <strong>Rentulo</strong>
      </div>
    </a>

    <nav class="nav" id="mainNav"></nav>
  </header>

  <main>
    <section class="home-hero">
      <div class="home-copy">
        <h1 data-i18n="home.title">Půjč si cokoli ve svém okolí.</h1>

        <p class="home-text" data-i18n="home.description">
          Najdi věci, které právě potřebuješ, přímo od lidí ve svém okolí.
          Nebo nabídni vlastní věci a vydělávej, když je zrovna nepoužíváš.
        </p>

        <form class="search-box" id="homeSearchForm">
          <div class="search-field">
            <label for="home-search-what" data-i18n="home.searchWhatLabel">Co hledáš?</label>
            <input
              id="home-search-what"
              type="text"
              placeholder="např. vysavač, gril nebo reproduktor"
              data-i18n-placeholder="home.searchWhatPlaceholder"
            />
          </div>

          <div class="search-field">
            <label for="home-search-where" data-i18n="home.searchWhereLabel">Kde?</label>
            <input
              id="home-search-where"
              type="text"
              placeholder="město nebo PSČ"
              data-i18n-placeholder="home.searchWherePlaceholder"
            />
          </div>

          <button type="submit" class="search-button">
            <span class="search-button-label" data-i18n="home.searchButton">Vyhledat</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 12h13" />
              <path d="m14 7 5 5-5 5" />
            </svg>
          </button>
        </form>

        <div class="home-points">
          <button type="button" class="home-point-button" data-category="Domácnost">
            <strong class="home-category-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M9 7.5h5.8a3.7 3.7 0 0 1 3.7 3.7v5.3H14a4 4 0 0 1-4-4v-5z" />
                <path d="M10 7.5V6.3A2.3 2.3 0 0 1 12.3 4H16" />
                <path d="M10 12.5H7.5L5 16" />
                <path d="M13.5 16.5V20" />
              </svg>
            </strong>
            <span data-i18n="home.category.household">Domácnost</span>
          </button>

          <button type="button" class="home-point-button" data-category="Zahrada">
            <strong class="home-category-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M4.5 15h11l2.2-5h2.3" />
                <path d="M6 15 7.2 11h7.4l1.4 4" />
                <circle cx="7.5" cy="18" r="1.7" />
                <circle cx="16" cy="18" r="1.7" />
                <path d="M8.5 11V8.5H13" />
                <path d="M17.7 10 19 7.5" />
              </svg>
            </strong>
            <span data-i18n="home.category.garden">Zahrada</span>
          </button>

          <button type="button" class="home-point-button" data-category="Stavba">
            <strong class="home-category-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M5 7h8.5l3 3-3 3H10l-2-2H5z" />
                <path d="M10 13 6.5 19" />
                <path d="M16.5 10H20" />
                <path d="M18.5 8v4" />
              </svg>
            </strong>
            <span data-i18n="home.category.construction">Stavba</span>
          </button>

          <button type="button" class="home-point-button" data-category="Hobby">
            <strong class="home-category-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M5 8h3.2l1.3-2h5l1.3 2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z" />
                <circle cx="12" cy="13.5" r="3.3" />
                <path d="M17.5 10.5h.1" />
              </svg>
            </strong>
            <span data-i18n="home.category.hobby">Hobby</span>
          </button>

          <button type="button" class="home-point-button" data-category="Párty">
            <strong class="home-category-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <rect x="7" y="3.5" width="10" height="17" rx="2" />
                <circle cx="12" cy="15" r="3.2" />
                <circle cx="12" cy="8.2" r="1.2" />
                <path d="M9.5 11.5h5" />
              </svg>
            </strong>
            <span data-i18n="home.category.party">Párty</span>
          </button>

          <button type="button" class="home-point-button" data-category="Ostatní">
            <strong class="home-category-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <rect x="5" y="5" width="5" height="5" rx="1.2" />
                <rect x="14" y="5" width="5" height="5" rx="1.2" />
                <rect x="5" y="14" width="5" height="5" rx="1.2" />
                <rect x="14" y="14" width="5" height="5" rx="1.2" />
              </svg>
            </strong>
            <span data-i18n="home.category.other">Ostatní</span>
          </button>
        </div>
      </div>

      <aside class="home-map-card">
        <div class="home-map-stage">
          <div class="home-map-shell">
            <div
              id="homeOffersMap"
              class="home-offers-map"
              aria-label="Mapa dostupných nabídek"
              data-i18n-aria-label="home.mapAriaLabel"
            ></div>
            <div class="home-map-notice">
              <div id="homeMapStatus" class="home-map-status" aria-live="polite" data-i18n="home.mapLoading">Načítám nabídky do mapy...</div>
              <div id="homeMapEmptyStatus" class="home-map-empty-status" aria-live="polite" data-i18n="home.mapEmpty" hidden>V zobrazené oblasti zatím nejsou žádné nabídky.</div>
            </div>
            <a class="home-map-attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap</a>
          </div>

          <div class="home-map-ui">
            <div class="home-map-zoom-controls" aria-label="Zoom mapy">
              <button id="homeMapZoomIn" class="home-map-zoom-button" type="button" aria-label="+">+</button>
              <button id="homeMapZoomOut" class="home-map-zoom-button" type="button" aria-label="−">−</button>
            </div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/home-page.js"></script>
</body>
</html>
