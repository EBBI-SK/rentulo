<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Keep all relative links rooted after the URL changes to /nabidka/ID. -->
  <base href="/" />
<link rel="icon" type="image/png" href="assets/rentulo-logo-mark.png" />
  <title>Detail věci - Rentulo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f7;
      color: #123f32;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      padding: 12px 0;
      background: #f4f6f7;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      display: block;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .logo-title {
      margin: 0;
      font-size: 22px;
      line-height: 1;
      color: #073f2e;
      font-family: Arial, sans-serif;
      font-weight: 700;
      letter-spacing: normal;
    }


    nav {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
    }

    nav a {
      font-weight: 500;
    }

    nav .active-link {
      font-weight: 800;
    }

    nav .btn-register,
    nav .logout-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #00835a;
      color: #ffffff !important;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 800;
      cursor: pointer;
    }

    main {
      padding: 8px 0 24px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
      color: #176747;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 16px;
      align-items: start;
    }

    .detail-main-card,
    .sidebar,
    .message-card {
      background: white;
      border: 1px solid #dfe5e8;
      border-radius: 16px;
      box-shadow: 0 10px 26px rgba(18, 63, 50, 0.06);
      overflow: hidden;
    }

    .detail-main-card {
      padding: 0;
    }

    .detail-hero {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 28px;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #dfe5e8;
    }

    .detail-hero-copy {
      min-width: 0;
      min-height: 220px;
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .detail-hero-copy h1 {
      margin-bottom: 18px;
    }

    .detail-hero-copy .category-line {
      margin-bottom: 16px;
    }

    .image-box {
      width: 100%;
      height: 220px;
      background: #eef1f3;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 1px solid #dfe5e8;
      border-radius: 14px;
    }

    .image-box.has-photo {
      height: 220px;
      max-height: 220px;
      background: #ffffff;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .image-icon {
      width: 54px;
      height: 54px;
      border-radius: 15px;
      background: #123f32;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
    }

    .image-label {
      display: none;
    }

    .image-box:not(.has-photo) .image-label {
      background: transparent;
      padding: 0;
      color: #4e5d56;
      border-radius: 0;
    }

    .detail-content {
      padding: 16px;
    }

    .category-line {
      font-size: 13px;
      margin: 0 0 10px;
      color: #334c43;
      font-weight: 700;
    }

    .category-line strong {
      color: #176747;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.05;
      color: #073f2e;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      background: #f1f4f5;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      color: #27483d;
      font-weight: 900;
      line-height: 1;
    }

    .badge.available {
      background: #f0faea;
      color: #176747;
    }

    .description-section {
      margin: 14px 0 16px;
      padding: 0 2px 16px;
      border-bottom: 1px solid #d6e8df;
    }

    .description-section h2 {
      margin: 0 0 7px;
      font-size: 16px;
      color: #073f2e;
    }

    .min-rental-notice {
      margin: 0 2px 16px;
      color: #176747;
      font-size: 14px;
      font-weight: 700;
    }

    .description {
      font-size: 14px;
      line-height: 1.5;
      color: #183f34;
      margin: 0;
      font-weight: 600;
    }

    .availability-panel {
      margin-bottom: 10px;
      padding: 9px 10px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 800;
    }

    .availability-panel.available {
      background: #f0faea;
      border: 1px solid #c7e8d7;
      color: #073f2e;
    }

    .availability-panel strong {
      display: block;
      margin-bottom: 3px;
      font-size: 14px;
    }

    .availability-panel.available strong {
      color: #176747;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }

    .section {
      background: transparent;
      border: 0;
      border-bottom: 1px solid #d6e8df;
      border-radius: 0;
      padding: 16px 2px;
    }

    .section:first-child {
      padding-top: 0;
    }

    .section:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .section h2 {
      margin: 0 0 7px;
      font-size: 16px;
      color: #073f2e;
    }

    .section ul {
      margin: 0;
      padding-left: 0;
      list-style: none;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    .section p {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      color: #183f34;
      font-weight: 700;
    }

    .pickup-preview {
      display: grid;
      gap: 7px;
      margin-top: 9px;
      font-size: 13px;
      line-height: 1.3;
    }

    .pickup-preview-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid #eee8de;
      padding-bottom: 7px;
    }

    .pickup-preview-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .pickup-preview-row span:first-child {
      color: #5b6862;
    }

    .pickup-preview-row span:last-child {
      color: #073f2e;
      font-weight: 900;
      text-align: right;
    }

    .gps-note {
      margin-top: 9px;
      padding: 8px 9px;
      border-radius: 11px;
      background: #f0faea;
      border: 1px solid #c7e8d7;
      color: #073f2e;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 900;
    }

    .gps-note.missing {
      background: #fff0f1;
      border-color: #f0b2bb;
      color: #9d2634;
    }

    .sidebar {
      padding: 16px;
      position: sticky;
      top: 12px;
      align-self: start;
    }

    .price {
      font-size: 31px;
      font-weight: 900;
      color: #176747;
      line-height: 1;
      margin-bottom: 1px;
    }

    .price-small {
      font-size: 13px;
      color: #5e6c66;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .info-list {
      display: grid;
      gap: 0;
      margin-bottom: 14px;
      border: 0;
      border-radius: 0;
      overflow: visible;
      background: transparent;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid #eee8de;
      padding: 8px 0;
      font-size: 13px;
      line-height: 1.3;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-row span:first-child {
      color: #5b6862;
      font-weight: 700;
    }

    .info-row span:last-child {
      font-weight: 900;
      text-align: right;
      color: #073f2e;
    }

    .privacy-box {
      background: #eef1f2;
      border: 1px solid #dae2df;
      border-radius: 12px;
      padding: 9px;
      margin-bottom: 9px;
      font-size: 12px;
      line-height: 1.35;
      color: #42564e;
      font-weight: 700;
    }

    .privacy-box strong {
      display: block;
      margin-bottom: 3px;
      color: #42564e;
      font-size: 13px;
    }

    .availability-box {
      border-radius: 12px;
      padding: 9px;
      margin-bottom: 9px;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
    }

    .availability-box.available {
      background: #f0faea;
      border: 1px solid #c7e8d7;
      color: #073f2e;
    }

    .availability-box.unavailable {
      background: #fff0f1;
      border: 1px solid #f0b2bb;
      color: #9d2634;
    }

    .availability-box strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
    }

    .availability-box.available strong {
      color: #176747;
    }

    .availability-box.unavailable strong {
      color: #9d2634;
    }

    .booking-box {
      margin-top: 0;
      background: transparent;
      border: 0;
      border-top: 1px solid #d6e8df;
      border-radius: 0;
      padding: 14px 0 0;
    }

    .booking-box h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: #073f2e;
    }

    .form-group {
      margin-bottom: 8px;
    }

    .form-group label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 900;
      color: #173e33;
    }

    .form-group input {
      width: 100%;
      height: 36px;
      border: 1px solid #d5dde1;
      border-radius: 10px;
      background: white;
      padding: 0 10px;
      font-size: 13px;
      color: #073f2e;
      font-weight: 700;
    }

    .form-group input:focus {
      outline: none;
      border-color: #d2e5dc;
      box-shadow: none;
    }

    .date-help {
      font-size: 12px;
      color: #68746f;
      line-height: 1.3;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .calculation {
      background: transparent;
      border: 0;
      border-top: 1px solid #d6e8df;
      border-radius: 0;
      margin: 12px 0 8px;
      overflow: visible;
      display: grid;
      gap: 0;
    }

    .calc-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 13px;
      border-bottom: 1px solid #eee8de;
      padding: 8px 0;
    }

    .calc-row:last-child {
      border-bottom: none;
    }

    .calc-row span {
      color: #5b6862;
      font-weight: 700;
    }

    .calc-row strong {
      color: #073f2e;
      text-align: right;
    }

    .calc-total {
      background: transparent;
      font-size: 14px;
      font-weight: 900;
    }

    .platform-fee-note {
      margin: 0 0 10px;
      font-size: 11.5px;
      line-height: 1.35;
      color: #68746f;
      font-weight: 700;
    }

    .booking-box + .note {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #d6e8df;
    }

    .primary-button {
      width: 100%;
      border: none;
      border-radius: 9px;
      background: #00835a;
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      padding: 9px 12px;
      cursor: pointer;
      text-align: center;
      min-height: 34px;
    }

    .primary-button:hover {
      background: #006846;
    }

    .primary-button.disabled,
    .primary-button:disabled {
      background: #d8d0c5;
      color: #5b6862;
      cursor: not-allowed;
    }

    .note {
      margin-top: 9px;
      font-size: 12px;
      color: #68746f;
      line-height: 1.35;
      font-weight: 700;
    }

    .message-card {
      padding: 16px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message-card strong {
      color: #176747;
    }

    .message-card.warning strong {
      color: #9d2634;
    }

    .message-card .primary-button {
      display: inline-flex;
      justify-content: center;
      width: auto;
      margin-top: 12px;
    }

    @media (max-width: 980px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        flex-wrap: wrap;
        gap: 16px;
      }

      .detail-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }
    }

    @media (max-width: 760px) {
      .container {
        padding: 0 14px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 25px;
      }

      .detail-hero {
        grid-template-columns: 1fr;
        gap: 14px;
        align-items: start;
      }

      .detail-hero-copy {
        min-height: 0;
        padding: 0;
      }

      .detail-hero-copy h1 {
        margin-bottom: 10px;
      }

      .detail-hero-copy .category-line {
        margin-bottom: 10px;
      }

      .image-box,
      .image-box.has-photo {
        height: 220px;
        max-height: 220px;
      }

      .detail-content {
        padding: 16px;
      }
    }

    @media (max-width: 430px) {
      header {
        padding: 8px 0;
      }

      .header-inner {
        gap: 10px;
      }

      .logo {
        gap: 12px;
        align-items: center;
      }

      .logo-icon {
        width: 38px;
        height: 38px;
      }

      .logo-title {
        font-size: 18px;
      }


      nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
        gap: 6px 8px;
        font-size: 14px;
        margin-top: 0;
      }

      nav a,
      nav .btn-register,
      nav .logout-link {
        width: 100%;
        min-height: 38px;
        justify-content: center;
        text-align: center;
        padding: 7px 10px;
        border-radius: 999px;
      }

      main {
        padding-top: 8px;
      }

      .back-link {
        font-size: 14px;
      }

      .detail-hero {
        padding: 14px;
      }

      .image-box,
      .image-box.has-photo {
        height: 200px;
        max-height: 200px;
      }

      .description {
        font-size: 14px;
      }

      .badges {
        gap: 6px;
      }

      .badge {
        font-size: 12px;
      }

      .info-row,
      .pickup-preview-row {
        flex-direction: column;
        gap: 2px;
      }

      .info-row span:last-child,
      .pickup-preview-row span:last-child {
        text-align: left;
      }

      .message-card .primary-button {
        width: 100%;
      }
    }


    /* Mint visual refresh for offer detail. Functional behavior stays unchanged. */
    body {
      background: #dff7ee !important;
      color: #173f35 !important;
    }

    header {
      background: transparent !important;
      padding: 12px 0 !important;
    }

    .logo-icon {
      width: 48px !important;
      height: 48px !important;
    }

    .logo-title {
      font-size: 25px !important;
      color: #173f35 !important;
    }

    .detail-main-card,
    .sidebar,
    .message-card {
      border-color: #cfe4da !important;
      box-shadow: 0 12px 32px rgba(23, 63, 53, 0.065) !important;
    }

    .detail-hero {
      border-bottom-color: #d6e8df !important;
    }

    .image-box {
      background: #edf8f3 !important;
      border-color: #d6e8df !important;
    }

    .image-box.has-photo {
      background: #ffffff !important;
    }

    .image-icon {
      background: #173f35 !important;
    }

    .category-line strong {
      color: #176747 !important;
    }

    .badge {
      background: #edf6f2 !important;
      color: #2f5a4c !important;
    }

    .badge.available {
      background: #eaf8e4 !important;
      color: #176747 !important;
    }

    .badge.unavailable,
    .message-card.warning {
      background: #fff0f1 !important;
      border-color: #f0b2bb !important;
      color: #9d2634 !important;
    }

    .badge.draft {
      background: #eef1f2 !important;
      border-color: #dae2df !important;
      color: #42564e !important;
    }

    .availability-panel {
      border-color: #d5e8df !important;
      background: #f7fcf9 !important;
    }

    .availability-panel.unavailable {
      background: #fff0f1 !important;
      border-color: #f0b2bb !important;
      color: #9d2634 !important;
    }

    .availability-panel.unavailable strong {
      color: #9d2634 !important;
    }

    .primary-button {
      background: #00835a !important;
      color: #ffffff !important;
      border-color: #00835a !important;
    }

    .primary-button:hover:not(:disabled):not(.disabled):not(.date-conflict) {
      background: #006846 !important;
      border-color: #006846 !important;
    }

    .primary-button.disabled,
    .primary-button:disabled {
      background: #d8d0c5 !important;
      color: #5b6862 !important;
      border-color: #d8d0c5 !important;
      cursor: not-allowed;
    }

    .primary-button.date-conflict {
      background: #fff0f1 !important;
      color: #9d2634 !important;
      border: 1px solid #f0b2bb !important;
      cursor: not-allowed;
    }


    input, select, textarea {
      border-color: #d2e5dc !important;
      background: #fff !important;
    }

    input:focus,
    select:focus,
    textarea:focus,
    button:focus,
    a:focus {
      outline: none !important;
      box-shadow: none !important;
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 1px solid rgba(64, 127, 101, 0.52) !important;
      outline-offset: 1px !important;
      box-shadow: none !important;
    }

    html[data-focus-input="pointer"] input:focus,
    html[data-focus-input="pointer"] select:focus,
    html[data-focus-input="pointer"] textarea:focus,
    html[data-focus-input="pointer"] button:focus,
    html[data-focus-input="pointer"] a:focus {
      outline: none !important;
      outline-offset: 0 !important;
      box-shadow: none !important;
    }

    @media (max-width: 760px) {
      .logo-icon { width: 48px !important; height: 48px !important; }
      .logo-title { font-size: 25px !important; }
      .detail-main-card, .sidebar, .message-card { border-radius: 16px !important; }
    }


    /* Compact, clearly explained image placeholder for offers without photos. */
    .image-box.no-photo {
      height: 150px !important;
      max-height: 150px !important;
      flex-direction: column;
      gap: 9px;
    }

    .image-box.no-photo .image-icon {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      background: #d7ede2 !important;
      color: #266b4e;
    }

    .image-box.no-photo .image-icon svg {
      width: 27px;
      height: 27px;
    }

    .image-box.no-photo .image-label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: #3e6555;
    }

  </style>
</head>

<body data-navigation-page="detail" data-i18n-document-title="detail.documentTitle">
  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img class="logo-icon" src="assets/rentulo-logo-mark.png" alt="" aria-hidden="true" />

        <div>
          <p class="logo-title">Rentulo</p>
          
        </div>
      </a>

      <nav id="mainNav"></nav>
    </div>
  </header>

  <main>
    <div class="container">
      <a href="vysledky.html" class="back-link" id="detailBackLink" data-rentulo-back="true" data-i18n="detail.back">← Zpět</a>
      <div id="detailContent"></div>
    </div>
  </main>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/offer-utils.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/navigation.js"></script>
<script src="js/detail-page.js"></script>

</body>
</html>
